name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Buffer regressions
        run: dotnet run --project tests/Satr.BufferTests/Satr.BufferTests.csproj -c Release
      - name: Port checks
        run: dotnet run --project tests/Satr.PortChecks/Satr.PortChecks.csproj -c Release
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libfontconfig1 libx11-6 libice6 libsm6 libicu-dev
      - name: Desktop smoke check (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a dotnet run --project tests/Satr.UiChecks -c Release
      - name: Desktop smoke check (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: dotnet run --project tests/Satr.UiChecks -c Release
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build self-contained packages and installer
        shell: pwsh
        run: ./scripts/Build.ps1 -Compiler "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Satr
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
