name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild and publish
        required: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Buffer regressions
        run: dotnet run --project tests/Satr.BufferTests/Satr.BufferTests.csproj -c Release
      - name: Port checks
        run: dotnet run --project tests/Satr.PortChecks/Satr.PortChecks.csproj -c Release
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libfontconfig1 libx11-6 libice6 libsm6 libicu-dev
      - name: Desktop smoke check (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a dotnet run --project tests/Satr.UiChecks -c Release
      - name: Desktop smoke check (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: dotnet run --project tests/Satr.UiChecks -c Release
  linux:
    # Linux deliverables only build on Linux: the tarball needs real Unix modes and the
    # DEB/Pacman packages need dpkg-deb, makepkg and repo-add. Building them on the
    # Windows runner silently produced a 0666 tarball and no packages at all.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Refresh the packaging tooling
        # A tag cut before a packaging fix carries tooling that no longer runs on the current
        # runner, so an in-flight release can never be finished from that tag alone. Refresh
        # only the build script; every shipped file still comes from the tag being released.
        run: |
          git fetch --depth=1 origin "${{ github.event.repository.default_branch }}"
          git checkout FETCH_HEAD -- packaging/linux-packages.sh
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot zstd libarchive-tools makepkg pacman-package-manager
          # alpm cannot create its local database under /var/lib as the runner user, and
          # makepkg reads it while it writes .BUILDINFO.
          sudo mkdir -p /var/lib/pacman/local
          sudo pacman-db-upgrade || true
          # Host configs disagree about the package format; the published name must not.
          printf 'source /etc/makepkg.conf\nPKGEXT=".pkg.tar.zst"\n' > "$RUNNER_TEMP/makepkg-ci.conf"
          echo "SATR_MAKEPKG_CONFIG=$RUNNER_TEMP/makepkg-ci.conf" >> "$GITHUB_ENV"
      - name: Build Linux tree, tarball and packages
        env:
          # Pacman's dependency check cannot resolve Arch package names on a Debian runner.
          SATR_MAKEPKG_NODEPS: '1'
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/Satr/Satr.csproj | head -n1)"
          test -n "$version"
          dotnet publish src/Satr/Satr.csproj -c Release -r linux-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o artifacts/linux-x64
          cp LICENSE README.md THIRD-PARTY-NOTICES.md artifacts/linux-x64/
          mkdir -p artifacts/linux-x64/licenses
          cp -r licenses/. artifacts/linux-x64/licenses/
          cp packaging/install-linux.sh packaging/uninstall-linux.sh artifacts/linux-x64/
          tar -czf "artifacts/Satr-$version-linux-x64.tar.gz" -C artifacts/linux-x64 .
          bash packaging/linux-packages.sh "$version" artifacts/linux-x64 artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: Satr-linux
          if-no-files-found: error
          path: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.pkg.tar.zst
            artifacts/satr.db*
            artifacts/satr.files*
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    needs: [test, linux]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows packages and installer
        shell: pwsh
        run: ./scripts/Build.ps1 -Compiler "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
      - name: Add Linux deliverables
        # Overwrites the Linux tarball that Build.ps1 produced on Windows, so the release
        # ships the archive built with the correct Unix modes.
        uses: actions/download-artifact@v4
        with:
          name: Satr-linux
          path: artifacts
      - name: Write release checksums
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/Satr/Satr.csproj -Raw)).Project.PropertyGroup.Version
          $assets = @(
            "Satr-$version-linux-x64.tar.gz",
            "satr_${version}_amd64.deb",
            "satr-$version-1-x86_64.pkg.tar.zst",
            'satr.db', 'satr.db.tar.zst', 'satr.files', 'satr.files.tar.zst',
            "Satr-$version-win-x64.zip",
            "Satr-Setup-$version-win-x64.exe"
          )
          $missing = @($assets | Where-Object { -not (Test-Path (Join-Path 'artifacts' $_)) })
          if ($missing.Count -gt 0) { throw "Missing release deliverables: $($missing -join ', ')" }
          $assets | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash (Join-Path 'artifacts' $_) -Algorithm SHA256).Hash.ToLowerInvariant(), $_
          } | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
          Write-Host "Verified $($assets.Count) deliverables of version $version."
      - uses: actions/upload-artifact@v4
        with:
          name: Satr
          if-no-files-found: error
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.deb
            artifacts/*.pkg.tar.zst
            artifacts/satr.db*
            artifacts/satr.files*
            artifacts/SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d') { throw "Refusing to publish a release for '$tag'." }
          $expected = @{}
          $names = @()
          foreach ($line in Get-Content artifacts/SHA256SUMS.txt) {
            $parts = $line -split '\s+', 2
            if ($parts.Count -ne 2) { throw "Malformed checksum line: $line" }
            $names += $parts[1].Trim()
            $expected[$parts[1].Trim()] = $parts[0].Trim()
          }

          # The REST endpoint for a tag never returns a draft, so ask the CLI instead: it finds
          # the draft an earlier attempt left behind and no second release is created.
          $exists = $true
          try {
            gh release view $tag --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) { $exists = $false }
          } catch { $exists = $false }
          if (-not $exists) {
            $create = @('release', 'create', $tag, '--draft', '--title', $tag, '--generate-notes', '--verify-tag')
            if ($tag -match '-') { $create += '--prerelease' }
            gh @create
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release $tag." }
            Write-Host "Created draft release $tag."
          }

          # GitHub's asset endpoint fails on multi-megabyte uploads often enough that a single
          # blind attempt is not viable, and parallel uploads make the gateway timeouts worse.
          foreach ($name in $names) {
            $uploaded = $false
            for ($attempt = 1; $attempt -le 4 -and -not $uploaded; $attempt++) {
              $uploaded = $true
              try { gh release upload $tag (Join-Path 'artifacts' $name) --clobber } catch { $uploaded = $false }
              if ($uploaded -and $LASTEXITCODE -ne 0) { $uploaded = $false }
              if (-not $uploaded) {
                if ($attempt -eq 4) { throw "Uploading $name failed after $attempt attempts." }
                $wait = 15 * $attempt
                Write-Warning "Upload of $name failed on attempt $attempt; retrying in $wait s."
                Start-Sleep -Seconds $wait
              }
            }
            Write-Host "Uploaded $name."
          }

          $remote = @{}
          foreach ($line in (gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.digest)"')) {
            $parts = $line -split ' ', 2
            $remote[$parts[0]] = $parts[1] -replace '^sha256:', ''
          }
          if ($remote.Count -eq 0) { throw "Could not read back the assets of release $tag." }
          foreach ($name in $names) {
            if (-not $remote.ContainsKey($name)) { throw "Release $tag is missing asset $name." }
            if ($remote[$name] -ne $expected[$name]) { throw "Digest mismatch on $name ($($remote[$name]))." }
          }
          Write-Host "Verified $($names.Count) release assets against SHA256SUMS.txt."

          $edit = @('release', 'edit', $tag, '--draft=false')
          if ($tag -match '-') { $edit += '--prerelease' } else { $edit += '--latest' }
          gh @edit
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag." }
          Write-Host "Published release $tag."
